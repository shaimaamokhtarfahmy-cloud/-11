<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 الهروب من جزيرة الكنز – Treasure Island Adventure</title>
<style>
  :root {
    --primary: #ff9f1c;
    --primary-dark: #e07a00;
    --secondary: #2ec4b6;
    --secondary-dark: #1d9a8e;
    --danger: #e71d36;
    --success: #20bf55;
    --wood: #8d5524;
    --wood-light: #c68642;
    --sand: #fdf0d5;
    --text-dark: #2b2d42;
    --card-bg: rgba(255, 255, 255, 0.94);
  }

  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.8s ease;
    overflow-x: hidden;
  }

  /* خلفيات المراحل الخمس */
  body.stage-0 { background: linear-gradient(135deg, #023e8a 0%, #0077b6 50%, #48cae4 100%); } /* السفينة الغارقة */
  body.stage-1 { background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #52b788 100%); } /* الغابة الغامضة */
  body.stage-2 { background: linear-gradient(135deg, #588157 0%, #a3b18a 50%, #dda15e 100%); } /* جسر التماسيح */
  body.stage-3 { background: linear-gradient(135deg, #240046 0%, #3c096c 50%, #5a189a 100%); } /* كهف الأسرار */
  body.stage-4 { background: linear-gradient(135deg, #9b2226 0%, #ca6702 50%, #ee9b00 100%); } /* قلعة الكنز */

  /* الشريط العلوي */
  header {
    width: 100%;
    max-width: 1100px;
    background: var(--wood);
    border-bottom: 6px solid #5c3716;
    border-radius: 0 0 24px 24px;
    padding: 15px 25px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    color: #fff;
    z-index: 10;
  }

  .game-title {
    font-size: 1.5rem;
    font-weight: 900;
    text-shadow: 2px 2px 0 #3d220a;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* أزرار ثلاثية الأبعاد كرتونية */
  .btn-3d {
    border: none;
    border-radius: 16px;
    padding: 12px 22px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    color: white;
    background: var(--primary);
    box-shadow: 0 6px 0 var(--primary-dark), 0 10px 15px rgba(0,0,0,0.25);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-3d:hover { filter: brightness(1.06); }
  .btn-3d:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--primary-dark), 0 4px 8px rgba(0,0,0,0.25);
  }

  .btn-teal { background: var(--secondary); box-shadow: 0 6px 0 var(--secondary-dark); }
  .btn-teal:active { box-shadow: 0 1px 0 var(--secondary-dark); }

  .btn-danger { background: var(--danger); box-shadow: 0 6px 0 #a81023; }
  .btn-danger:active { box-shadow: 0 1px 0 #a81023; }

  .btn-success { background: var(--success); box-shadow: 0 6px 0 #158038; }
  .btn-success:active { box-shadow: 0 1px 0 #158038; }

  /* شريط التقدم والنقاط */
  .progress-wrapper {
    width: 95%;
    max-width: 1050px;
    background: var(--card-bg);
    margin-top: 18px;
    padding: 15px 25px;
    border-radius: 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    border: 4px solid var(--wood-light);
  }

  .score-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .score-badge {
    background: #ffd166;
    color: #5c3716;
    padding: 6px 18px;
    border-radius: 50px;
    border: 3px solid #f4a261;
    font-size: 1.4rem;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
  }

  .progress-track {
    width: 100%;
    height: 28px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #8d5524;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffbe0b, #fb5607, #ff006e);
    border-radius: 16px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* خريطة الجزيرة التفاعلية */
  .island-map {
    width: 95%;
    max-width: 1050px;
    margin-top: 15px;
    background: var(--sand);
    border: 5px dashed var(--wood);
    border-radius: 24px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow-x: auto;
    gap: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .map-node {
    flex: 1;
    min-width: 130px;
    background: #fff;
    border: 4px solid #ccc;
    border-radius: 18px;
    padding: 10px;
    text-align: center;
    position: relative;
    transition: all 0.4s ease;
    opacity: 0.65;
  }

  .map-node.active {
    opacity: 1;
    border-color: var(--primary);
    background: #fff8e7;
    transform: scale(1.06);
    box-shadow: 0 6px 15px rgba(255, 159, 28, 0.4);
  }

  .map-node.completed {
    opacity: 1;
    border-color: var(--success);
    background: #e8f8ee;
  }

  .node-icon { font-size: 2.3rem; display: block; }
  .node-title { font-weight: 800; font-size: 1rem; margin-top: 4px; display: block; }

  /* منطقة اللعب الرئيسية */
  main {
    width: 95%;
    max-width: 1050px;
    margin: 20px auto 40px;
    background: var(--card-bg);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    border: 6px solid var(--wood-light);
    text-align: center;
    position: relative;
  }

  .stage-banner {
    display: inline-block;
    background: var(--wood);
    color: #ffd166;
    padding: 8px 25px;
    border-radius: 50px;
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 15px;
  }

  .story-box {
    background: #f1faee;
    border-right: 6px solid var(--secondary);
    padding: 15px 20px;
    border-radius: 14px;
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .question-card {
    background: #ffffff;
    border: 4px solid #bde0fe;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.06);
  }

  .question-text {
    font-size: 1.75rem;
    font-weight: 900;
    color: #1d3557;
    margin: 0 0 25px 0;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }

  .option-btn {
    background: #f8f9fa;
    border: 4px solid #adb5bd;
    border-radius: 20px;
    padding: 18px 20px;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-dark);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 6px 0 #adb5bd;
    transition: all 0.15s ease;
    text-align: right;
  }

  .option-btn:hover:not(:disabled) {
    background: #e0fbfc;
    border-color: var(--secondary);
    box-shadow: 0 6px 0 var(--secondary-dark);
    transform: translateY(-2px);
  }

  .option-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--secondary-dark);
  }

  .option-letter {
    background: var(--primary);
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .option-btn.wrong {
    background: #ffe5ec;
    border-color: var(--danger);
    box-shadow: 0 6px 0 #a81023;
    animation: shake 0.5s ease;
  }

  .option-btn.correct {
    background: #d8f3dc;
    border-color: var(--success);
    box-shadow: 0 6px 0 #158038;
    animation: bounce 0.6s ease;
  }

  /* رسائل التغذية الراجعة */
  .feedback-banner {
    padding: 18px;
    border-radius: 18px;
    font-size: 1.4rem;
    font-weight: 800;
    margin-top: 20px;
    display: none;
  }

  .feedback-wrong {
    background: #fff3cd;
    border: 3px solid #ffbe0b;
    color: #856404;
    display: block;
  }

  .feedback-correct {
    background: #d4edda;
    border: 3px solid #28a745;
    color: #155724;
    display: block;
  }

  /* شاشة اختيار المسار وصناديق المفاجآت */
  .paths-container {
    display: none;
    margin-top: 25px;
    animation: fadeIn 0.5s ease;
  }

  .paths-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--wood);
    margin-bottom: 20px;
  }

  .paths-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }

  .path-card {
    background: linear-gradient(180deg, #fff 0%, #fff3b0 100%);
    border: 4px solid var(--primary);
    border-radius: 22px;
    padding: 22px;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--primary-dark);
    transition: transform 0.2s;
  }

  .path-card:hover {
    transform: translateY(-6px);
  }

  .path-icon { font-size: 3.5rem; display: block; margin-bottom: 10px; }
  .path-name { font-size: 1.4rem; font-weight: 900; color: #3d220a; }
  .path-desc { font-size: 1.05rem; color: #555; margin-top: 8px; }

  /* نافذة الحدث المفاجئ */
  .event-modal {
    display: none;
    background: #fff8e7;
    border: 5px solid #ff9f1c;
    border-radius: 24px;
    padding: 25px;
    margin-top: 20px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .event-emoji { font-size: 4.5rem; display: block; margin-bottom: 10px; }
  .event-title { font-size: 1.8rem; font-weight: 900; color: #d62828; margin-bottom: 10px; }
  .event-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; line-height: 1.5; }

  /* شاشة الفوز */
  .victory-screen {
    display: none;
    padding: 20px;
    animation: popIn 0.6s ease;
  }

  .treasure-chest {
    font-size: 6.5rem;
    display: inline-block;
    animation: bounce 1.2s infinite;
  }

  /* لوحة تحكم المعلم (Modal) */
  .modal-overlay {
    display: none;
